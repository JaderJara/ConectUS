<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - ConectUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/perfil.css">
</head>
<body>
    <div class="background-image">
        <header>
            <div class="logo">
                <img src="img/escudo.png" alt="Logo de ConectUS" class="logo-img">
                <h1>ConectUS</h1>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
            <a href="novedades.html">Novedades</a>
            <a href="catalogo.html">catalogo</a>
            <div class="dropdown">
                <a href="#" class="nav-link" onclick="toggleReservationsDropdown(event)">Donaciones</a>
                <div class="reservations-dropdown" id="reservationsDropdown">
                    <a href="donaciones.html" class="dropdown-item">Donaciones</a>
                    <a href="misDonaciones.html" class="dropdown-item">Mis Donados</a>
                </div>
                <a href="#" class="nav-link" onclick="toggleReservationsDropdown(event)">Reservas</a>
                <div class="reservations-dropdown" id="reservationsDropdown">
                    <a href="reservas.html" class="dropdown-item">Reservas</a>
                    <a href="misReservas.html" class="dropdown-item">Mis Reservados</a>
                </div>
            </nav>
        </header>

        <main class="profile-container">
            <section class="profile-section" aria-label="Sección de Perfil">
                <h2>¡Tu Perfil!</h2>
                <div class="profile-card">
                    <img src="img/avatar-default.png" alt="Foto de Perfil" class="profile-pic" id="profile-pic" onerror="this.src='https://via.placeholder.com/100';">
                    <div class="profile-info">
                        <h3 id="profile-name">usuario</h3>
                    </div>
                    <button class="edit-btn" aria-label="Editar perfil" onclick="showEditForm()">¡Editar Perfil!</button>
                </div>
            </section>

            <section class="info-section" aria-label="Sección de Información del usuario">
                <h3>Información</h3>
                <div class="info-container">
                    <div class="info-card">
                        <span class="info-label">Nombre Completo:</span>
                        <p id="student-name">usuario</p>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Correo Electrónico:</span>
                        <p id="student-email">usuario@ejemplo.com</p>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Tipo de Usuario:</span>
                        <p id="user-type">usuario</p>
                    </div>
                </div>
            </section>

            <!-- Formulario para Editar Perfil -->
            <div class="form-container" id="edit-profile-form" style="display: none;">
                <div class="form-box">
                    <a href="#" class="back-arrow" onclick="hideEditForm()">← Volver</a>
                    <h3>Editar Perfil</h3>
                    <form id="profile-form" enctype="multipart/form-data">
                        <label for="edit-name">Nombre Completo:</label>
                        <input type="text" id="edit-name" name="edit-name" required placeholder="Escribe tu nombre completo" pattern="[A-Za-z\s]+" title="Solo letras y espacios" value="Nombre completo">
                        
                        <label for="edit-email">Correo Electrónico:</label>
                        <input type="email" id="edit-email" name="edit-email" required placeholder="Tu correo personal" value="usuario@ejemplo.com">
                        
                        <label for="edit-grade">Grado:</label>
                        <input type="text" id="edit-grade" name="edit-grade" required placeholder="Tu grado" pattern="[A-Za-z\s0-9]+" title="Solo letras, números y espacios" value="No especificado">
                        
                        <label for="edit-user-type">Tipo de Usuario:</label>
                        <select id="edit-user-type" name="edit-user-type" required>
                            <option value="student" selected>usuario</option>
                            <option value="administrator">Administrador</option>
                        </select>
                        
                        <label for="edit-pic">Foto de Perfil:</label>
                        <input type="file" id="edit-pic" name="edit-pic" accept="image/*" onchange="previewImage(event)">
                        
                        <button type="submit" class="submit-btn">Guardar Cambios</button>
                    </form>
                </div>
            </div>

            <!-- Botón de cerrar sesión -->
            <button class="logout-btn" aria-label="Cerrar sesión" onclick="logout()">¡Cerrar Sesión!</button>
        </main>
    </div>
    <script>
        // Mostrar el formulario de edición
        function showEditForm() {
            document.getElementById('edit-profile-form').style.display = 'flex';
        }

        // Ocultar el formulario de edición
        function hideEditForm() {
            document.getElementById('edit-profile-form').style.display = 'none';
        }

        // Previsualizar la imagen seleccionada
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profile-pic');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Manejar el envío del formulario (frontend)
        document.getElementById('profile-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('edit-name').value;
            const email = document.getElementById('edit-email').value;
            const grade = document.getElementById('edit-grade').value;
            const userType = document.getElementById('edit-user-type').value;

            // Actualizar la información en la interfaz
            document.getElementById('profile-name').textContent = name;
            document.getElementById('student-name').textContent = name;
            document.getElementById('student-email').textContent = email;
            document.getElementById('student-grade').textContent = grade;
            document.getElementById('user-type').textContent = userType === 'student' ? 'usuario' : 'Administrador';

            // Ocultar el formulario
            hideEditForm();

            // Enviar datos al backend (ejemplo)
            const formData = new FormData(this);
            fetch('/update-profile', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Perfil actualizado con éxito');
                } else {
                    alert('Error al actualizar el perfil');
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Función para cerrar sesión
        function logout() {
            localStorage.clear(); // Limpiar datos locales
            fetch('/logout', {
                method: 'POST',
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'seccion.html'; // Redirige a la página de inicio de sesión
                } else {
                    alert('Error al cerrar sesión');
                    window.location.href = 'seccion.html'; // Redirige incluso si hay error
                }
            })
            .catch(error => {
                console.error('Error:', error);
                window.location.href = 'seccion.html'; // Redirige incluso si falla la solicitud
            });
        }
    </script>
</body>
</html>
